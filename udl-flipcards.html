<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three facilitator gaps, three UDL principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,700;1,400;1,600&display=swap">
<style>
:root{--bg:#eaf1ff;--navy:#0b214f;--gap:#3f68ab}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Montserrat,system-ui,sans-serif;padding:18px 16px 14px}
h1{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;white-space:nowrap;font-size:clamp(.9rem,4.5vw,2.6rem);text-align:center;margin:0 0 6px;letter-spacing:.01em;line-height:1.1}
.sub{text-align:center;font-style:italic;margin:0 0 16px;font-size:.95rem}
.tools{text-align:center;margin-bottom:14px}
.tools button{font:inherit;font-weight:700;font-size:.9rem;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
.tools button:focus-visible,.card:focus-visible{outline:3px solid #f2b84b;outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;max-width:1000px;margin:0 auto;padding:8px 6px}
.card{all:unset;box-sizing:border-box;display:block;width:100%;aspect-ratio:1/1;cursor:pointer;perspective:1200px;container-type:inline-size;transition:transform .25s;transform:rotate(var(--r,0deg))}
.card:hover{transform:rotate(0deg) scale(1.02)}
.inner{display:block;position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card[aria-pressed=true] .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:3px 3px 14px 3px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12cqw 9cqw 14cqw;color:var(--navy);box-shadow:0 10px 18px rgba(11,33,79,.28),0 2px 3px rgba(11,33,79,.2)}
.face::before{content:"";position:absolute;top:-10px;left:50%;width:34%;height:22px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(11,33,79,.15)}
.face::after{content:"";position:absolute;right:0;bottom:0;width:13%;height:13%;background:linear-gradient(135deg,rgba(11,33,79,.0) 50%,rgba(11,33,79,.16) 50%);border-radius:0 0 14px 0}
.front{background:#ffe27a}
.back{transform:rotateY(180deg);background:var(--c)}
.t,.d{display:block}
.t{font-weight:700;font-size:clamp(.95rem,6.6cqw,1.3rem);line-height:1.2;margin:0 0 3cqw}
.back .t{font-weight:400}.back .t b{display:block;font-weight:800;font-size:1.12em;margin-top:2px}
.d{font-style:italic;font-size:clamp(.85rem,5.2cqw,1.08rem);line-height:1.4}
.hint{position:absolute;bottom:4.5cqw;left:0;right:0;font-size:clamp(.68rem,3.6cqw,.8rem);opacity:.8;letter-spacing:.03em}
@media (max-width:600px){.grid{grid-template-columns:1fr;max-width:360px;gap:30px}}
@media (prefers-reduced-motion:reduce){.inner,.card{transition:none}}
.credit{text-align:center;font-style:italic;font-weight:600;font-size:.85rem;margin:16px 0 0}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<h1>Three Facilitator Gaps; Three UDL Principles</h1>
<p class="sub">Select a card to flip it and see the UDL principle that answers each gap.</p>
<div class="tools"><button id="all" type="button">Flip all cards</button></div>
<div class="grid" id="grid"></div>
<p class="credit">UDL principles from Ralabate (2011)</p>
<script>
var cards=[
 {gap:"Motivational and identity gap",gd:"Experienced educators shifting from knowledge deliverer to cognitive orchestrator",p:"ENGAGEMENT",pd:"A climate of trust, errors as learning opportunities, tasks tied to real jobs",c:"#dcc9f7",r:"-2deg"},
 {gap:"Evaluative gap",gd:"Assessment habits built around standardised, finished work",p:"ACTION AND EXPRESSION",pd:"Different ways to show competence",c:"#bfe9e1",r:"1.5deg"},
 {gap:"Cognitive and digital (AI) literacy gap",gd:"Uneven tech confidence; dense text overloads",p:"REPRESENTATION",pd:"Visual, auditory and conceptual forms",c:"#ffd2b3",r:"-1deg"}
];
var grid=document.getElementById("grid"),btns=[];
function label(b,i){var c=cards[i],on=b.getAttribute("aria-pressed")==="true";
 b.setAttribute("aria-label",on?("UDL principle: multiple means of "+c.p.toLowerCase()+". "+c.pd+". Press to flip back to the gap."):("Facilitator gap: "+c.gap+". "+c.gd+". Press to reveal the UDL principle that answers it."));
 b.querySelector(".front").setAttribute("aria-hidden",on);b.querySelector(".back").setAttribute("aria-hidden",!on);}
cards.forEach(function(c,i){
 var b=document.createElement("button");b.type="button";b.className="card";b.setAttribute("aria-pressed","false");b.style.setProperty("--c",c.c);b.style.setProperty("--r",c.r);
 b.innerHTML='<span class="inner"><span class="face front"><span class="t">'+c.gap+'</span><span class="d">'+c.gd+'</span><span class="hint">Flip to see the UDL principle &#8594;</span></span>'+
 '<span class="face back"><span class="t">Multiple means of <b>'+c.p+'</b></span><span class="d">'+c.pd+'</span><span class="hint">&#8592; Flip back to the gap</span></span></span>';
 b.addEventListener("click",function(){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");label(b,i);});
 grid.appendChild(b);btns.push(b);label(b,i);
});
var all=document.getElementById("all"),flipped=false;
all.addEventListener("click",function(){flipped=!flipped;btns.forEach(function(b,i){b.setAttribute("aria-pressed",flipped);label(b,i);});all.textContent=flipped?"Flip all back":"Flip all cards";});
</script>
</body>
</html>
