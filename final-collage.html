<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build the collage: what this module taught me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&display=swap">
<style>
:root{--bg:#eaf1ff;--navy:#0b214f;--muted:#3d4d78;--purple:#5b479d;--teal:#0e7c86}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Montserrat,system-ui,sans-serif;padding:14px 16px 18px}
h1{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;text-align:center;margin:0 0 4px;font-size:clamp(1.3rem,5vw,2.2rem);letter-spacing:.01em;line-height:1.1}
.sub{text-align:center;margin:0 auto 12px;font-size:.9rem;max-width:62ch;color:var(--muted)}
.wrap{max-width:900px;margin:0 auto}
.board{position:relative;border-radius:6px;box-shadow:0 6px 18px rgba(11,33,79,.22);overflow:hidden;background:#f6ecd8;border:3px solid #fff;outline:2px dashed transparent;transition:outline-color .15s}
.board.over{outline-color:var(--purple)}
.board svg{display:block;width:100%;height:auto}
.badge circle{fill:#fff;stroke:var(--navy);stroke-width:2;opacity:.8}
.badge text{font:700 13px Montserrat,sans-serif;fill:var(--navy);text-anchor:middle;dominant-baseline:central}
.placed .badge circle{fill:var(--navy);opacity:1}
.placed .badge text{fill:#fff}
.ghost{fill:none;stroke:var(--navy);stroke-width:2;stroke-dasharray:7 6;opacity:.38}
.slot.hint .ghost{opacity:1;stroke:var(--purple);stroke-width:3;animation:pulse 1s ease-in-out infinite}
.slot.hint .badge circle{opacity:1;stroke:var(--purple);stroke-width:3}
@keyframes pulse{50%{stroke-opacity:.35}}
.piece{opacity:0}
.slot.placed .piece{opacity:1}
.slot.placed .ghost{display:none}
.slot.flash .piece{animation:flash .9s ease}
@keyframes flash{30%{filter:brightness(1.25) drop-shadow(0 0 10px #fff)}}
.extras{opacity:0;transition:opacity .8s}
.done .extras{opacity:1}
.wing{animation:flap .5s ease-in-out infinite alternate}
.wing.r{animation-delay:0s}
@keyframes flap{to{transform:scaleX(.5)}}
.status{min-height:1.5em;text-align:center;font-weight:600;font-size:.88rem;margin:8px 0 4px}
.tools{text-align:center;margin:0 0 6px}
.tools[hidden]{display:none}
.tools button{font:inherit;font-weight:700;font-size:.85rem;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
button:focus-visible{outline:3px solid #f2b84b;outline-offset:3px}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:8px 4px}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;position:relative;cursor:grab;padding:14px 9px 9px;border-radius:3px 3px 12px 3px;background:var(--c);box-shadow:0 3px 7px rgba(11,33,79,.22);transform:rotate(var(--r,0deg));transition:transform .2s,opacity .3s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.card::before{content:"";position:absolute;top:-8px;left:50%;width:38%;height:16px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(11,33,79,.15)}
.card:hover{transform:rotate(0) scale(1.03)}
.card:focus-visible{outline:3px solid #f2b84b;outline-offset:3px}
.card .n{font-weight:700;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.card .t{font-weight:700;font-size:.8rem;line-height:1.2}
.card .d{font-size:.7rem;line-height:1.32}
.card[aria-disabled=true]{opacity:.5;cursor:pointer;box-shadow:none}
.card[aria-disabled=true] .n::after{content:" ✓"}
.dragging{position:fixed;z-index:50;pointer-events:none;margin:0;transform:rotate(4deg) scale(1.04)!important;box-shadow:0 12px 24px rgba(11,33,79,.35);opacity:.95}
@media(max-width:700px){.tray{grid-template-columns:repeat(2,1fr);gap:12px}.card .d{font-size:.68rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

<script>
/* Edit the thoughts here. Keep the ids 1 to 8; each one is tied to a piece of the picture. */
var THOUGHTS = [
 {id:1, entry:"Entry 1", piece:"the sun", title:"Every mode is a choice", text:"Text, image, audio, video or interaction: none of them is neutral. Each choice is a design judgement.", c:"#ffe27a"},
 {id:2, entry:"Entry 2", piece:"the hill", title:"Affordances are only potential", text:"A tool helps only if learners are guided to use it as intended. Otherwise the affordance is wasted.", c:"#ffc2d1"},
 {id:3, entry:"Entry 3", piece:"the tree", title:"Feeling shapes learning", text:"A frustrating tool can drain motivation even when the content is manageable.", c:"#aee6df"},
 {id:4, entry:"Entry 4", piece:"the gate", title:"Give learners many ways in", text:"UDL gave me options, but a good idea also has to survive real workload, time and people.", c:"#d9cbf7"},
 {id:5, entry:"Entry 5", piece:"the scales", title:"Cutting load can cut access", text:"CTML and UDL each fix a problem the other can create. I try to hold both.", c:"#ffcfa5"},
 {id:6, entry:"Entry 6", piece:"the swallow", title:"Every feature must earn its place", text:"The agent had to justify itself against the theory. Noticing the cost made my design more considered.", c:"#ffe27a"},
 {id:7, entry:"Entry 7", piece:"the path", title:"Build the map before anyone walks it", text:"Learning my own tools showed me where facilitators will struggle, so I planned their path first.", c:"#ffc2d1"},
 {id:8, entry:"Entry 8", piece:"the signpost", title:"Guide the process, leave the meaning open", text:"Fix the structure, such as where the AI-free and AI-mediated phases sit, and leave the content to the facilitators.", c:"#aee6df"}
];
var FINAL_WORDS = "still becoming";
var FINAL_MESSAGE = "That is the whole picture, for now. Like this journal, it is not a final thought. I would rearrange it every time I learn something new.";

var svg=document.getElementById("svg"), board=document.getElementById("board"), tray=document.getElementById("tray");
var statusEl=document.getElementById("status"), resetBtn=document.getElementById("reset"), svgTitle=document.getElementById("svgtitle");
var placed={}, count=0, reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var anchors={1:[770,107],2:[450,440],3:[110,250],4:[450,226],5:[800,243],6:[277,154],7:[470,486],8:[621,264]};
var rot=[-1.5,1.2,-.8,1.6,-1.2,.9,-1.6,1.1];

THOUGHTS.forEach(function(t,i){
  var b=document.createElement("button"); b.type="button"; b.className="card"; b.id="c"+t.id;
  b.style.setProperty("--c",t.c); b.style.setProperty("--r",rot[i]+"deg");
  b.innerHTML='<span class="n">'+t.id+' · '+t.entry+'</span><span class="t">'+t.title+'</span><span class="d">'+t.text+'</span>';
  b.setAttribute("aria-label",t.entry+": "+t.title+". "+t.text+" Press Enter to place it on the board as "+t.piece+".");
  tray.appendChild(b);
  b.addEventListener("pointerenter",function(){ if(!placed[t.id]) slot(t.id).classList.add("hint"); });
  b.addEventListener("pointerleave",function(){ slot(t.id).classList.remove("hint"); });
  b.addEventListener("focus",function(){ if(!placed[t.id]) slot(t.id).classList.add("hint"); });
  b.addEventListener("blur",function(){ slot(t.id).classList.remove("hint"); });
  b.addEventListener("click",function(){ if(b._dragged){b._dragged=false;return;} place(t.id,null); });
  b.addEventListener("pointerdown",function(e){ startDrag(e,b,t.id); });
});
function slot(id){return document.getElementById("s"+id);}

function place(id,from){
  if(placed[id]){ var s0=slot(id); s0.classList.remove("flash"); void s0.getBoundingClientRect(); s0.classList.add("flash"); return; }
  placed[id]=true; count++;
  var s=slot(id); s.classList.remove("hint"); s.classList.add("placed");
  var card=document.getElementById("c"+id); card.setAttribute("aria-disabled","true");
  var piece=s.querySelector(".piece");
  if(!reduce && piece.animate){
    var a=anchors[id], p=from||a, dx=p[0]-a[0], dy=p[1]-a[1];
    if(!from){ dx=(Math.random()<.5?-1:1)*60; dy=-90; }
    piece.style.transformBox="fill-box"; piece.style.transformOrigin="center";
    piece.animate([{transform:"translate("+dx+"px,"+dy+"px) rotate(-14deg) scale(.5)",opacity:0},{transform:"none",opacity:1}],{duration:650,easing:"cubic-bezier(.2,1.25,.4,1)"});
  }
  var t=THOUGHTS[id-1];
  statusEl.textContent=count+" of 8 pieces placed. "+t.entry+" became "+t.piece+": "+t.title+".";
  var names=THOUGHTS.filter(function(x){return placed[x.id];}).map(function(x){return x.piece;});
  svgTitle.textContent="A paper-cut collage scene. Pieces placed so far: "+names.join(", ")+".";
  document.getElementById("tools").hidden=false;
  if(count===8) finish();
}

function finish(){
  var g=document.getElementById("title");
  if(!g.firstChild){
    var fonts=["Abril Fatface","Special Elite","Anton","Abril Fatface"], cols=["#f6d9e0","#f2c94c","#5cc4bd","#8a5bb0","#ef7d32","#7a2c4a"], txt=["#7a2c4a","#0b214f","#0b214f","#fff","#fff","#fff"];
    var x=270, i=0;
    FINAL_WORDS.split("").forEach(function(ch){
      if(ch===" "){ x+=14; return; }
      var k=i%6, r=((i*37)%13)-6;
      var gr=document.createElementNS("http://www.w3.org/2000/svg","g");
      gr.setAttribute("transform","translate("+x+",36) rotate("+r+")");
      gr.setAttribute("filter","url(#lift)");
      gr.innerHTML='<rect x="-17" y="-24" width="35" height="46" fill="'+cols[k]+'"/><text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'+fonts[i%4]+'" font-size="34" font-weight="700" fill="'+txt[k]+'">'+ch+'</text>';
      g.appendChild(gr); x+=34; i++;
    });
  }
  board.classList.add("done");
  svg.classList.add("done");
  setTimeout(function(){ statusEl.textContent=FINAL_MESSAGE; },900);
}
resetBtn.addEventListener("click",function(){
  placed={}; count=0; svg.classList.remove("done"); board.classList.remove("done");
  document.querySelectorAll(".slot").forEach(function(s){s.classList.remove("placed","flash","hint");});
  document.querySelectorAll(".card").forEach(function(c){c.removeAttribute("aria-disabled");});
  statusEl.textContent="0 of 8 pieces placed."; svgTitle.textContent="A paper-cut collage scene, still empty."; document.getElementById("tools").hidden=true;
});
/* the .done class needs to sit on the svg wrapper for the extras */
var st=document.createElement("style"); st.textContent=".done .extras,svg.done .extras{opacity:1}"; document.head.appendChild(st);

function toSvg(cx,cy){ var pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy; var m=svg.getScreenCTM(); if(!m) return null; var q=pt.matrixTransform(m.inverse()); return [q.x,q.y]; }
function startDrag(e,card,id){
  if(e.pointerType==="touch"||e.button!==0||placed[id]) return;
  var sx=e.clientX, sy=e.clientY, ghost=null, r=card.getBoundingClientRect(), moved=false;
  function mv(ev){
    if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
    if(!moved){ moved=true; ghost=card.cloneNode(true); ghost.removeAttribute("id"); ghost.classList.add("dragging"); ghost.style.width=r.width+"px"; document.body.appendChild(ghost); }
    ghost.style.left=(ev.clientX-r.width/2)+"px"; ghost.style.top=(ev.clientY-20)+"px";
    var b=board.getBoundingClientRect(); board.classList.toggle("over",ev.clientX>b.left&&ev.clientX<b.right&&ev.clientY>b.top&&ev.clientY<b.bottom);
  }
  function up(ev){
    window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up);
    board.classList.remove("over");
    if(!moved) return;
    card._dragged=true; setTimeout(function(){card._dragged=false;},0);
    ghost.remove();
    var b=board.getBoundingClientRect();
    if(ev.clientX>b.left&&ev.clientX<b.right&&ev.clientY>b.top&&ev.clientY<b.bottom){ place(id,toSvg(ev.clientX,ev.clientY)); }
  }
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
}
</script>
</body>
