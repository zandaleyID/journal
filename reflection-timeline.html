<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looking back and looking ahead: an interactive timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{--bg:#eaf1ff;--navy:#0b214f;--muted:#3d4d78;--purple:#5b479d;--teal:#0e7c86}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Montserrat,system-ui,sans-serif;padding:14px 16px 16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;text-align:center;margin:0 0 2px;font-size:clamp(1.2rem,4.5vw,1.9rem);line-height:1.1}
.sub{text-align:center;margin:0 0 6px;font-size:.85rem;color:var(--muted)}
/* phase tags */
.phases{position:relative;height:26px;margin-top:8px}
.tag{position:absolute;top:0;transform:translateX(-50%);font-weight:700;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:2px;white-space:nowrap;box-shadow:0 2px 4px rgba(11,33,79,.2)}
.t-back{left:25%;background:#ffc2d1;transform:translateX(-50%) rotate(-1.5deg)}
.t-now{left:56.25%;background:#f2c94c;transform:translateX(-50%) rotate(1.2deg)}
.t-ahead{left:81.25%;background:#aee6df;transform:translateX(-50%) rotate(-1deg)}
/* track */
.track{position:relative;height:190px;list-style:none;margin:0;padding:0}
.line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stop{position:absolute;width:12.5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;margin:0;padding:0}
.stop .node{all:unset;box-sizing:border-box;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font:700 1rem Montserrat,sans-serif;color:var(--navy);background:var(--c);border:3px solid var(--navy);box-shadow:0 3px 6px rgba(11,33,79,.25);transition:transform .2s}
.stop .node:hover{transform:scale(1.1)}
.stop .node:focus-visible{outline:3px solid #f2b84b;outline-offset:3px}
.stop.ahead .node{border-style:dashed;background:#fff}
.stop.ahead .node{box-shadow:none}
.stop.active .node{transform:scale(1.22);background:var(--c);border-style:solid;box-shadow:0 0 0 5px rgba(91,71,157,.28),0 3px 6px rgba(11,33,79,.25)}
.stop.ahead.active .node{background:var(--c)}
.stop .label{margin-top:6px;font-weight:600;font-size:.72rem;line-height:1.2;text-align:center;max-width:96px}
.stop.active .label{font-weight:700}
.detail-inline{display:none}
/* panel */
.panel{background:#fff;border-radius:3px 3px 14px 3px;box-shadow:0 4px 10px rgba(11,33,79,.22);padding:16px 18px 14px;position:relative;margin-top:6px;min-height:128px}
.panel::before{content:"";position:absolute;top:-9px;left:50%;width:90px;height:18px;transform:translateX(-50%) rotate(-1.5deg);background:rgba(242,201,76,.75);box-shadow:0 1px 2px rgba(11,33,79,.15)}
.panel .kicker{font-weight:700;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin:0 0 2px}
.panel h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:1.35rem;margin:0 0 4px}
.panel p{margin:0;font-size:.98rem;line-height:1.5}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.nav button{font:inherit;font-weight:700;font-size:.82rem;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:7px 16px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid #f2b84b;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:640px){
 .phases{display:none}
 .track{height:auto;display:flex;flex-direction:column;gap:0;padding-left:8px;margin-top:10px}
 .line{display:none}
 .track::before{content:"";position:absolute;left:30px;top:20px;bottom:20px;border-left:4px solid var(--navy)}
 .stop{position:relative;left:auto!important;top:auto!important;width:100%;transform:none;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:6px 0}
 .stop .label{margin:0;text-align:left;max-width:none;font-size:.9rem;flex:1}
 .stop .node{flex:none;width:44px;height:44px}
 .stop.back::before{content:none}
 .detail-inline{width:100%;margin-left:56px;padding:2px 6px 8px 0;font-size:.9rem;line-height:1.45}
 .stop.active .detail-inline{display:block}
 .panel{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<h1>How my thinking has changed</h1>
<p class="sub" id="how">Select a stop, or use the Next and Previous buttons, to move along the timeline.</p>

<div class="phases" aria-hidden="true"><span class="tag t-back">Looking back</span><span class="tag t-now">Now</span><span class="tag t-ahead">Looking ahead</span></div>

<ol class="track" id="track" aria-label="Timeline of eight stops from looking back to looking ahead">
<svg class="line" viewBox="0 0 800 190" preserveAspectRatio="none" aria-hidden="true">
<polyline id="solid" fill="none" stroke="#0b214f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<polyline id="dash" fill="none" stroke="#0b214f" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
</svg>
</ol>

<div class="panel" id="panel" aria-live="polite">
<p class="kicker" id="pk"></p><h2 id="pt"></h2><p id="pp"></p>
<div class="nav"><button type="button" id="prev">Previous</button><button type="button" id="next">Next</button></div>
</div>
</div>

<script>
/* Edit the stops here. Phase must be "back", "now" or "ahead". */
var STOPS = [
 {phase:"back", kicker:"Looking back", label:"A rigid process", title:"A rigid process", text:"I began by seeing instructional design as a rigid process: learn the theories, apply the frameworks, and the design follows.", c:"#ffc2d1"},
 {phase:"back", kicker:"Looking back", label:"Theory first", title:"Theory first", text:"Feeling out of my depth, I put theory first, and I still believe it is what makes a design defensible.", c:"#ffc2d1"},
 {phase:"back", kicker:"Looking back", label:"Getting creative", title:"Getting creative", text:"In Practical Project 2, letting myself get creative with the facilitator's experience produced many ideas.", c:"#ffc2d1"},
 {phase:"back", kicker:"Looking back", label:"Empathy", title:"Creativity guided by empathy", text:"Putting myself in the facilitator's shoes showed me the ideas would overwhelm them, so I made the design achievable.", c:"#ffc2d1"},
 {phase:"now", kicker:"Now", label:"Evolving", title:"Design that evolves", text:"I now see design as evolving and never certain, so I test early, gather feedback and keep iterating.", c:"#f2c94c"},
 {phase:"ahead", kicker:"Looking ahead · soon", label:"Build a unit", title:"Build a unit", text:"Build one unit of CoTrace in Moodle or Articulate Rise to see it on a real platform and grow my technical skills.", c:"#aee6df"},
 {phase:"ahead", kicker:"Looking ahead · long term", label:"Test with facilitators", title:"Test with facilitators", text:"Eventually test CoTrace with facilitators or educators before any students, so feedback can cascade through the design.", c:"#aee6df"},
 {phase:"ahead", kicker:"Looking ahead · always", label:"Humans at the centre", title:"Humans at the centre", text:"Use AI tools fully, but keep human creativity and empathy at the heart of good design.", c:"#aee6df"}
];
var track=document.getElementById("track"), cur=0, N=STOPS.length;
var ys=[50,100,50,100,50,100,50,100];
var pts=STOPS.map(function(s,i){return ((i+.5)*100)+","+ys[i];});
var nowIdx=STOPS.findIndex(function(s){return s.phase==="now";});
document.getElementById("solid").setAttribute("points",pts.slice(0,nowIdx+1).join(" "));
document.getElementById("dash").setAttribute("points",pts.slice(nowIdx).join(" "));
STOPS.forEach(function(s,i){
  var li=document.createElement("li"); li.className="stop "+s.phase; li.style.left=((i+.5)*12.5)+"%"; li.style.top=(ys[i]-23)+"px"; li.style.setProperty("--c",s.c);
  li.innerHTML='<button type="button" class="node" aria-label="Stop '+(i+1)+' of '+N+': '+s.title+'">'+(i+1)+'</button><span class="label">'+s.label+'</span><div class="detail-inline" aria-hidden="true"><strong>'+s.title+'.</strong> '+s.text+'</div>';
  li.querySelector(".node").addEventListener("click",function(){show(i,true);});
  track.appendChild(li);
});
function show(i,focus){
  cur=i; var s=STOPS[i];
  track.querySelectorAll(".stop").forEach(function(li,k){li.classList.toggle("active",k===i); li.querySelector(".node").setAttribute("aria-current",k===i?"step":"false");});
  document.getElementById("pk").textContent=s.kicker; document.getElementById("pt").textContent=s.title; document.getElementById("pp").textContent=s.text;
  document.getElementById("prev").disabled=i===0; document.getElementById("next").disabled=i===N-1;
  var inl=track.querySelectorAll(".detail-inline"); inl.forEach(function(d,k){d.setAttribute("aria-hidden",k===i?"false":"true");});
}
document.getElementById("prev").addEventListener("click",function(){if(cur>0)show(cur-1);});
document.getElementById("next").addEventListener("click",function(){if(cur<N-1)show(cur+1);});
track.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();var n=Math.min(N-1,cur+1);show(n);track.querySelectorAll(".node")[n].focus();}
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();var p=Math.max(0,cur-1);show(p);track.querySelectorAll(".node")[p].focus();}
});
show(0);
</script>
</body>
</html>
